@if (auth.logado()) {
<div class="shell">

  <aside class="sidebar">

    <div class="sidebar-brand">
      <div class="brand-name">Mecânica DBO</div>
      <div class="brand-tag">OFICINA · DESDE 1998</div>
    </div>

    <nav class="sidebar-nav">

      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Painel</span>
      </a>

      <a routerLink="/clientes" routerLinkActive="active" class="nav-item">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Clientes</span>
        @if (totalClientes() !== null) {
          <span class="nav-count">{{ totalClientes() }}</span>
        }
      </a>

      <a routerLink="/veiculos" routerLinkActive="active" class="nav-item">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round">
          <path d="M4 17v-4l2-5h12l2 5v4"></path>
          <path d="M4 13h16"></path>
          <circle cx="7" cy="17" r="1.6"></circle>
          <circle cx="17" cy="17" r="1.6"></circle>
        </svg>
        <span>Veículos</span>
      </a>

      <a routerLink="/ordens" routerLinkActive="active" class="nav-item">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 3.5a4.5 4.5 0 0 0 5.9 5.9L21 10l-7.6 7.6"></path>
          <path d="M13.4 17.6 8 23l-4-4 5.4-5.4"></path>
        </svg>
        <span>Ordens de Serviço</span>
        @if (osAbertas() !== null) {
          <span class="nav-count">{{ osAbertas() }}</span>
        }
      </a>

    </nav>

    <div class="sidebar-foot">
      <div class="sync-status">
        <span class="sync-dot" [class.offline]="!apiOnline()"></span>
        <span>{{ apiOnline() ? 'Sincronizado ' + (horaSync() || 'agora') : 'API offline' }}</span>
      </div>
      <button class="btn btn-ghost btn-tema" type="button" (click)="tema.alternar()"
              [attr.aria-label]="tema.tema() === 'escuro' ? 'Mudar para o tema claro' : 'Mudar para o tema escuro'">
        @if (tema.tema() === 'escuro') {
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
          <span>Tema claro</span>
        } @else {
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
          </svg>
          <span>Tema escuro</span>
        }
      </button>
      <button class="btn btn-ghost" type="button" (click)="auth.logout()" style="margin-top: 4px; width: 100%;">Sair</button>
    </div>

  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>

</div>
} @else {
  <router-outlet></router-outlet>
}
