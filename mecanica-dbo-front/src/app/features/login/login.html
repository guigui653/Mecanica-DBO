<main class="login-wrap">
  <form class="login-card" (ngSubmit)="entrar()" autocomplete="on">
    <div class="login-brand">
      <span class="login-mark">DBO</span>
      <h1>Mecânica DBO</h1>
      <p>Acesse o sistema da oficina</p>
    </div>

    <div class="field">
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" class="input" type="text"
             [(ngModel)]="usuario" autocomplete="username" required autofocus />
    </div>

    <div class="field">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" class="input" type="password"
             [(ngModel)]="senha" autocomplete="current-password" required />
    </div>

    @if (erro()) {
      <p class="login-erro" role="alert">{{ erro() }}</p>
    }

    <button class="btn btn-primary login-btn" type="submit"
            [disabled]="carregando() || !usuario || !senha">
      {{ carregando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</main>
