# ============================================================
#  MECÂNICA DBO — Perfil de produção (PC da oficina)
#  Ative com a variável de ambiente SPRING_PROFILES_ACTIVE=prod.
#  Só sobrescreve o que muda; o resto vem do application.properties.
# ============================================================

# Swagger desligado: a documentação da API não fica exposta na rede.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Sem SQL no console e log só do que importa.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.com.mecanicadbo=INFO
logging.level.org.hibernate.SQL=WARN
