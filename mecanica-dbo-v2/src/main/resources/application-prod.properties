# ============================================================
#  MECÂNICA DBO — Perfil de produção (PC da oficina)
#  Ative com a variável de ambiente SPRING_PROFILES_ACTIVE=prod.
#  Só sobrescreve o que muda; o resto vem do application.properties.
# ============================================================

# Swagger desligado: a documentação da API não fica exposta na rede.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Sem SQL no console e log só do que importa.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.com.mecanicadbo=INFO
logging.level.org.hibernate.SQL=WARN

# Só este computador acessa o sistema (http://localhost:8080). Outros
# aparelhos da rede não conseguem abrir.
server.address=127.0.0.1

# Telas do Angular (pasta gerada pelo scripts\gerar-pacote.ps1).
spring.web.resources.static-locations=file:${APP_SITE:C:/MecanicaDBO/app/site/}

# Log do sistema em arquivo, para conferir depois.
logging.file.name=${APP_LOG:C:/MecanicaDBO/logs/sistema.log}
