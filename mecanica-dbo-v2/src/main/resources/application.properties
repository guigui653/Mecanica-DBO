# ============================================================
#  MECÂNICA DBO — Configurações de Exemplo
# ============================================================

server.port=8080

# ── Acesso à aplicação ─────────────────────────────────────
# Defina APP_USERNAME e APP_PASSWORD no Windows (ou na Run Configuration do IntelliJ).
app.admin.username=${APP_USERNAME:admin}
# Sem senha padrão: se APP_PASSWORD não estiver definida, o sistema se recusa a subir.
app.admin.password=${APP_PASSWORD:}

# Origens do frontend liberadas no CORS (separe por vírgula). Em produção, o endereço real.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Cookie de sessão
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# ── Recibo em PDF ────────────────────────────────────────────
# Gerado só com Java (templates/pdf/recibo.html). Não usa mais Python.
# Dados que aparecem no cabeçalho do recibo.
# Endereço e telefone são opcionais: vazio = a linha some do recibo.
# (\u00e2 = "â"; o escape garante o acento certo no recibo.)
app.oficina.nome=Mec\u00e2nica DBO
app.oficina.endereco=
app.oficina.telefone=

# ── OCR de notas fiscais ─────────────────────────────────────
# Endereço do microserviço Python (mecanica-dbo-ocr/ocr_service.py). Mesmo PC: deixe o padrão.
app.ocr.url=${OCR_URL:http://127.0.0.1:5000}

# Fotos de celular passam de 1 MB (o padrão do Spring). Sem estas duas linhas
# o upload falha antes de chegar ao controller.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Banco de dados ───────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/mecanica_dbo
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=10

# ── JSON ─────────────────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Swagger ──────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Log ──────────────────────────────────────────────────────
logging.level.com.mecanicadbo=DEBUG
logging.level.org.hibernate.SQL=DEBUG
